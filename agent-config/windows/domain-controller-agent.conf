<!--
  Wazuh Security Framework
  Windows Domain Controller telemetry collection delta

  Purpose:
  - collect Microsoft-Windows-NTLM/Operational so NTLM audit events are visible
    to the manager and can be used for evidence-based NTLM posture assessment.

  The standard Wazuh Windows agent configuration already collects the Security
  channel. WSF therefore adds only the telemetry source that is missing from the
  standard agent configuration and avoids defining a duplicate Security
  collector.

  This file is intentionally portable. It contains no customer-specific
  domains, hostnames, agent IDs, groups or addresses.

  Deployment note:
  This is a shared agent-configuration delta, not a complete replacement for an
  existing Wazuh agent configuration. Deploy it through a dedicated manager-side
  group for Windows domain controllers, validate that the agent automatically
  reloads after receiving the shared configuration, and verify end-to-end
  ingestion of Microsoft-Windows-NTLM/Operational events at the manager before
  broader rollout.
-->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-NTLM/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
