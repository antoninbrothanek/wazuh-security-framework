<!--
  Wazuh Security Framework
  Windows Domain Controller telemetry collection delta

  Purpose:
  - collect the Windows Security channel required by WSF authentication rules;
  - collect Microsoft-Windows-NTLM/Operational so NTLM audit events are visible
    to the manager and can be used for evidence-based NTLM posture assessment.

  This file is intentionally portable. It contains no customer-specific
  domains, hostnames, agent IDs, groups or addresses.

  Deployment note:
  This is a shared agent-configuration fragment, not a complete replacement for
  an existing Wazuh agent configuration. Merge it into the appropriate Wazuh
  manager shared configuration scope and validate effective agent configuration
  before production rollout.
-->
<agent_config os="Windows">
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-NTLM/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
